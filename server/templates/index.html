<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Quality Management Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
    --card-bg: rgba(30, 41, 59, 0.45);
    --card-border: rgba(255, 255, 255, 0.08);
    --pm1-color: #a3e635;
    --pm25-color: #06b6d4;
    --pm10-color: #ec4899;
    --accent-blue: #38bdf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-gradient);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 460px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding-bottom: 16px;
  }
  .header-info h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .header-info p {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  
  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    color: #34d399;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 10px #34d399;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  /* AQI Score Panel */
  .aqi-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .aqi-panel::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .aqi-title {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .aqi-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    margin-top: 6px;
    transition: all 0.5s ease;
  }
  .precaution-text {
    font-size: 12px;
    color: var(--text-primary);
    margin-top: 10px;
    line-height: 1.4;
  }

  /* Unified PM Grid */
  .pm-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .pm-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: transform 0.2s, border-color 0.2s;
  }
  .pm-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.15);
  }
  .pm-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 3px;
    border-radius: 3px 3px 0 0;
  }
  .pm-card.pm1::after { background: var(--pm1-color); box-shadow: 0 0 10px var(--pm1-color); }
  .pm-card.pm25::after { background: var(--pm25-color); box-shadow: 0 0 10px var(--pm25-color); }
  .pm-card.pm10::after { background: var(--pm10-color); box-shadow: 0 0 10px var(--pm10-color); }

  .pm-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  .pm-val {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
  }
  .pm-unit {
    font-size: 10px;
    color: var(--text-secondary);
  }

  /* Status Notices */
  .notice-box {
    background: rgba(15, 23, 42, 0.4);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.5;
    border-left: 4px solid var(--accent-blue);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.3s ease;
  }
  .notice-box.warning {
    border-left-color: #f43f5e;
    background: rgba(244, 63, 94, 0.05);
  }
  .notice-box.info {
    border-left-color: var(--accent-blue);
    background: rgba(56, 189, 248, 0.05);
  }
  .notice-box strong {
    color: #ffffff;
    font-size: 13px;
  }
  .notice-text {
    color: var(--text-secondary);
  }

  /* Control Section */
  .control-section {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: opacity 0.2s;
  }
  .control-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .control-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .control-sub {
    font-size: 11px;
    color: var(--text-secondary);
  }
  
  /* System State Indicators */
  .state-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 6px;
    margin-top: 4px;
    display: inline-block;
  }
  .state-badge.auto { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); }
  .state-badge.manual { background: rgba(236, 72, 153, 0.1); color: #f472b6; }
  .state-badge.on { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
  .state-badge.off { background: rgba(244, 63, 94, 0.1); color: #fb7185; }

  /* Switch styling */
  .switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #334155; transition: .3s; border-radius: 34px;
  }
  .slider:before {
    position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px;
    background-color: white; transition: .3s; border-radius: 50%;
  }
  
  #modeSwitch:checked + .slider { background-color: #ec4899; }
  #modeSwitch:checked + .slider:before { transform: translateX(24px); }

  #motorSwitch:checked + .slider { background-color: #22c55e; }
  #motorSwitch:checked + .slider:before { transform: translateX(24px); }

  .disabled-row { opacity: 0.35; pointer-events: none; }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-info">
      <h1>Air Host Server</h1>
      <p>Mobile Remote Management Portal</p>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>ONLINE</span>
    </div>
  </div>

  <!-- AQI Assessment Panel -->
  <div class="aqi-panel">
    <div>
      <div class="aqi-title">Air Assessment</div>
      <div id="aqi-badge" class="aqi-badge" style="background: #475569;">Checking...</div>
      <div id="precaution-text" class="precaution-text">Awaiting sensor data...</div>
    </div>
  </div>

  <!-- Unified Particulate Matter Dashboard -->
  <div class="pm-grid">
    <!-- PM 1.0 Card -->
    <div class="pm-card pm1">
      <span class="pm-label">PM 1.0</span>
      <span id="pm1" class="pm-val">--</span>
      <span class="pm-unit">µg/m³</span>
    </div>
    <!-- PM 2.5 Card -->
    <div class="pm-card pm25">
      <span class="pm-label">PM 2.5</span>
      <span id="pm25" class="pm-val">--</span>
      <span class="pm-unit">µg/m³</span>
    </div>
    <!-- PM 10 Card -->
    <div class="pm-card pm10">
      <span class="pm-label">PM 10</span>
      <span id="pm10" class="pm-val">--</span>
      <span class="pm-unit">µg/m³</span>
    </div>
  </div>

  <!-- Dynamic System Notification Box -->
  <div class="notice-box info" id="mode-notice-box">
    <strong>System State Notice:</strong>
    <div id="mode-precaution-text" class="notice-text">Connecting to host...</div>
  </div>

  <!-- Controller Panel -->
  <div class="control-section">
    <!-- Mode Switch -->
    <div class="control-row">
      <div class="control-info">
        <span class="control-title">Manual Override</span>
        <span class="control-sub">Disable safety automatons</span>
        <div><span id="sys-mode" class="state-badge auto">AUTO</span></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="modeSwitch" onclick="changeMode(this)">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Motor Switch -->
    <div class="control-row" id="motorCtrlRow">
      <div class="control-info">
        <span class="control-title">Vacuum Motor</span>
        <span class="control-sub">Operate exhaust relay</span>
        <div><span id="motor" class="state-badge off">OFF</span></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="motorSwitch" onclick="toggleMotor(this)">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<script>
function changeMode(element) {
  let mode = element.checked ? 1 : 0;
  fetch("/setMode?manual=" + mode)
    .then(res => res.json())
    .then(d => updateUI(d));
}

function toggleMotor(element) {
  let state = element.checked ? 1 : 0;
  fetch("/toggleMotor?state=" + state)
    .then(res => res.json())
    .then(d => updateUI(d));
}

function updateUI(d) {
  // Update PM values
  document.getElementById("pm25").innerHTML = d.pm2_5;
  document.getElementById("pm1").innerHTML = d.pm1_0;
  document.getElementById("pm10").innerHTML = d.pm10;

  let modeText = document.getElementById("sys-mode");
  let modeSwitch = document.getElementById("modeSwitch");
  let motorRow = document.getElementById("motorCtrlRow");
  let modePrecText = document.getElementById("mode-precaution-text");
  let modeNoticeBox = document.getElementById("mode-notice-box");

  if(d.manual == 1) {
    modeText.innerHTML = "MANUAL";
    modeText.className = "state-badge manual";
    modeSwitch.checked = true;
    motorRow.className = "control-row";
    modeNoticeBox.className = "notice-box warning";
    modePrecText.innerHTML = "Automated threshold safety triggers are OFF. Manual override is active.";
  } else {
    modeText.innerHTML = "AUTO";
    modeText.className = "state-badge auto";
    modeSwitch.checked = false;
    motorRow.className = "control-row disabled-row";
    modeNoticeBox.className = "notice-box info";
    modePrecText.innerHTML = "Automated protection running. Motor activates automatically if PM2.5 > " + (d.pm25_threshold || 200) + " µg/m³.";
  }

  let motorText = document.getElementById("motor");
  let motorSwitch = document.getElementById("motorSwitch");
  if(d.motor == 1) {
    motorText.innerHTML = "ON";
    motorText.className = "state-badge on";
    motorSwitch.checked = true;
  } else {
    motorText.innerHTML = "OFF";
    motorText.className = "state-badge off";
    motorSwitch.checked = false;
  }

  let b = document.getElementById("aqi-badge");
  let p = document.getElementById("precaution-text");
  
  if (d.aqi_label) {
    b.innerHTML = d.aqi_label;
    b.style.backgroundColor = d.aqi_color;
    p.innerHTML = d.precaution;
  } else {
    let val = d.pm2_5;
    if(val <= 50) {
      b.innerHTML = "Good"; b.style.backgroundColor = "#10b981";
      p.innerHTML = "Air quality is great! Safe to enjoy outdoor physical exercise.";
    } else if(val <= 100) {
      b.innerHTML = "Moderate"; b.style.backgroundColor = "#f59e0b";
      p.innerHTML = "Acceptable quality. Unusually sensitive people should limit heavy outdoor work.";
    } else if(val <= 200) {
      b.innerHTML = "Poor"; b.style.backgroundColor = "#ef4444";
      p.innerHTML = "Wear air masks outdoors. Sensitive individuals should remain inside.";
    } else {
      b.innerHTML = "Hazardous"; b.style.backgroundColor = "#730202";
      p.innerHTML = "Hazardous air! Close all windows, run air filters, and keep motor running.";
    }
  }
}

setInterval(() => {
  fetch("/data")
    .then(res => res.json())
    .then(d => updateUI(d))
    .catch(err => console.log("Fetch error:", err));
}, 1500);

fetch("/data").then(res => res.json()).then(d => updateUI(d));
</script>
</body>
</html>
